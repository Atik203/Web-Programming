<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      label {
        display: block;
        margin-top: 3px;
        font-weight: bold;
      }
      input[type="submit"],
      button {
        margin-top: 4px;
        padding: 3px 10px;
        background: #0284c7;
        color: white;
        cursor: pointer;
        border: none;
        border-radius: 2px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 3px;
        margin-top: 4px;
        border: 1px solid black;
      }

      .center {
        text-align: center;
      }
    </style>
  </head>
  <body></body>
</html>
