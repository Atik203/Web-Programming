<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FINAL 251 — Q1: Password Strength Checker</title>
</head>
<body>

<h2>Password Strength Checker</h2>

<input type="password" id="fVal" placeholder="Enter password">
<button id="btn" onclick="processApp()">Check Strength</button>
<p id="msgOut"></p>

<script>
// ============================================================================
// FINAL 251 — Q1 (10 marks)                    [cheat sheet: boxes 1, 2, 6, 7C]
// Score: length +10 per 2 chars beyond the 6-char minimum | UPPER +15 |
//        lower +15 | digit +20 | special (!@#$%^&*) +25
// Levels: >=91 Very Strong | >=71 Strong | >=51 Medium | >=31 Weak | else Very Weak
// 100+ -> "Perfect Password!" | >8 tries without Strong -> "Need practice!"
// Sample: abc -> Very Weak | hello123 -> Weak | Strong@Pass -> Strong
//         Perfect@Pass123 -> Perfect Password!
// ============================================================================

// STAGE 0: State Variables OUTSIDE the Function!
let attempts      = 0;
let reachedStrong = false;

function processApp() {
    // STAGE 1: Extract & Parse
    let p   = document.getElementById("fVal").value;
    let out = document.getElementById("msgOut");

    // STAGE 2: Mutate State (count this attempt)
    attempts++;

    // STAGE 3: Rule Scoring + regex checks         [Box 7 Engine C]
    let score = 0;
    if (p.length >= 6) {
        score += Math.floor((p.length - 6) / 2) * 10;   // length past the minimum
    }
    if (/[A-Z]/.test(p))      score += 15;   // uppercase
    if (/[a-z]/.test(p))      score += 15;   // lowercase
    if (/[0-9]/.test(p))      score += 20;   // numbers
    if (/[!@#$%^&*]/.test(p)) score += 25;   // special characters

    // STAGE 4: Level Ladder (check the highest range first!)
    let level;
    if (score >= 100)      level = "Perfect Password!";
    else if (score >= 91)  level = "Very Strong";
    else if (score >= 71)  level = "Strong";
    else if (score >= 51)  level = "Medium";
    else if (score >= 31)  level = "Weak";
    else                   level = "Very Weak";

    if (score >= 71) reachedStrong = true;

    // STAGE 5: Render DOM Feedback
    out.innerHTML = "Score: " + score + " - " + level;
    if (score >= 100) {
        out.innerHTML += "<br>Success! Your password is extremely strong.";
    }

    // STAGE 6: Attempts Guard (>8 tries without ever reaching Strong)
    if (attempts > 8 && !reachedStrong) {
        out.innerHTML += "<br>Need practice! Tip: 12+ characters, mix UPPER and lower case, numbers and symbols like !@#$%^&*";
    }
}
</script>

</body>
</html>
