<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Strength Checker</title>
</head>
<body>

<h2>Password Strength Checker</h2>

<input type="password" id="passwordInput" placeholder="Enter password">
<button onclick="checkStrength()">Check Strength</button>
<p id="result"></p>
<p id="tips"></p>

<script>
// ============================================================================
// FINAL 251 — Q1 (10 marks)
// Scoring: length +10 per 2 chars beyond the 6-char minimum
//          uppercase +15 | lowercase +15 | numbers +20 | special (!@#$%^&*) +25
// Levels:  0-30 Very Weak | 31-50 Weak | 51-70 Medium | 71-90 Strong | 91+ Very Strong
// 100+ -> "Perfect Password!"    More than 8 attempts without Strong -> "Need practice!"
//
// NOTE: the sample outputs (hello123 -> Weak, Strong@Pass -> Strong) only match
// if length points count characters BEYOND the 6-char minimum.
// ============================================================================

let attempts = 0;
let reachedStrong = false;

function checkStrength() {
    let password = document.getElementById("passwordInput").value;
    let result   = document.getElementById("result");
    let tips     = document.getElementById("tips");

    attempts++;

    let score = 0;

    // 1) LENGTH: +10 for every 2 characters beyond the minimum of 6
    if (password.length >= 6) {
        score += Math.floor((password.length - 6) / 2) * 10;
    }

    // 2) character-class checks
    if (/[A-Z]/.test(password)) score += 15;                 // uppercase
    if (/[a-z]/.test(password)) score += 15;                 // lowercase
    if (/[0-9]/.test(password)) score += 20;                 // numbers
    if (/[!@#$%^&*]/.test(password)) score += 25;            // special characters

    // 3) strength level
    let level;
    if (score >= 91) {
        level = "Very Strong";
    } else if (score >= 71) {
        level = "Strong";
    } else if (score >= 51) {
        level = "Medium";
    } else if (score >= 31) {
        level = "Weak";
    } else {
        level = "Very Weak";
    }

    if (score >= 71) {
        reachedStrong = true;
    }

    // 4) display score + level
    result.innerHTML = "Score: " + score + " — " + level;

    // 5) perfect password
    if (score >= 100) {
        result.innerHTML += "<br>Perfect Password! Success!";
    }

    // 6) more than 8 attempts without reaching Strong
    if (attempts > 8 && !reachedStrong) {
        tips.innerHTML = "Need practice! Try: 12+ characters, mix UPPER and lower case, " +
                         "add numbers and special characters like !@#$%^&*";
    }
}
</script>

</body>
</html>
