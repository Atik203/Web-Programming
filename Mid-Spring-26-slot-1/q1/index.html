<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Spring 2026 Mid Slot 1</title>
  </head>
  <body>
    <header>
      <nav>
        <h2>CORE-TECH</h2>

        <div>
          <ul>
            <li><a href="">OVERVIEW</a></li>
            <li><a href="">ANALYTICS</a></li>
            <li><a href="">REPORTS</a></li>
            <li><a href="">SECURITY</a></li>
          </ul>
        </div>

        <h4>Admin: System_Rool</h4>
      </nav>
    </header>
    <main>
      <section class="card-container">
        <div class="card bg1">
          <h3 class="sub-title">Total Users</h3>
          <h2 class="title">12,450</h2>
          <button class="card-button">UP +12% MONTHLY</button>
        </div>
        <div class="card bg2">
          <h3 class="sub-title">Revenue</h3>
          <h2 class="title">$84,200</h2>
          <button class="card-button">UP +5.2% WEEKLY</button>
        </div>
        <div class="card bg3">
          <h3 class="sub-title">Active Task</h3>
          <h2 class="title">18</h2>
          <button class="card-button">4 TASKS PENDING</button>
        </div>
        <div class="card bg4">
          <h3 class="sub-title">System Health</h3>
          <h2 class="title">99.9%</h2>
          <button class="card-button">SYSTEM STABLE</button>
        </div>
      </section>

      <section class="form-section">
        <div class="system" style="border: 1px solid black; min-width: 500px">
          <h3 class="form-title">System Configuration</h3>
          <hr style="border: 2px solid black" />
          <form action="" class="form">
            <div class="grid-2">
              <div class="form-group">
                <label for="">Server Name</label>
                <input
                  type="text"
                  class="input"
                  placeholder="Enter Server Alias"
                />
              </div>
              <div class="form-group">
                <label for=""></label>
                <input type="text" class="input" />
              </div>
            </div>
          </form>
        </div>
        <div class="access" style="border: 1px solid black; min-width: 500px">
          <h3 class="form-title">Access Permissions</h3>
          <hr style="border: 2px solid black" />
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
